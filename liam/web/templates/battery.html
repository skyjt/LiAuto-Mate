{% extends "base.html" %}
{% block title %}电池 · LiAuto-Mate{% endblock %}
{% block assets %}<script src="/static/vendor/echarts.min.js"></script>{% endblock %}
{% block content %}
<div class="grid">
  <section class="card"><h2>月度里程</h2><div id="bar" class="chart"></div></section>
  <section class="card"><h2>电量采样分布 · 近 90 天</h2><div id="hist" class="chart"></div></section>
</div>
<section class="card stack"><h2>电量变化 · 近 7 天</h2><p id="soc-note" class="muted" hidden></p><div id="soc" class="chart"></div></section>
<section class="card stack"><h2>静置电耗 · 近 30 天</h2><div id="vamp"></div></section>
<script>
const months = {{ months | map(attribute='date') | list | tojson }};
const mileage = {{ months | map(attribute='mileage_km') | list | tojson }};
const bar = document.getElementById('bar');
if (mileage.some(m => m != null)) {
  dashboard.chart(bar, {xAxis:{type:'category',data:months},yAxis:{type:'value',name:'km'},
    series:[{type:'bar',name:'里程',data:mileage}]});
} else dashboard.message(bar, '暂无云端月度里程。');

dashboard.load(document.getElementById('hist'), '/api/v1/soc-histogram.json', (data, el) => {
  if (!data.samples) return dashboard.message(el, '近 90 天没有有效电量采样。');
  dashboard.chart(el, {
    xAxis:{type:'category',name:'%',data:data.buckets.map((_,i)=>i*10+'–'+(i+1)*10)},
    yAxis:{type:'value',name:'样本数',minInterval:1},series:[{type:'bar',name:'采样数',data:data.buckets}]
  });
});
dashboard.load(document.getElementById('soc'), '/api/v1/signal/Vehicle.Powertrain.Battery.ResidueBattery.json?hours=168', (data, el) => {
  if (data.truncated) {
    const note = document.getElementById('soc-note');
    note.textContent = '当前显示最近 ' + data.points.length + ' 条变化记录。';
    note.hidden = false;
  }
  const points = data.points.filter(p => p.v != null && String(p.v).trim() && Number.isFinite(Number(p.v)) && Number(p.v)>=0 && Number(p.v)<=100);
  if (!points.length) return dashboard.message(el, '近 7 天没有有效电量记录。');
  dashboard.chart(el, {xAxis:{type:'time'},yAxis:{type:'value',name:'%',min:0,max:100},
    series:[{name:'电量',type:'line',step:'end',data:points.map(p=>[p.t,Number(p.v)])}]});
});
dashboard.load(document.getElementById('vamp'), '/api/v1/vampire-drain.json?days=30', (rows, el) => {
  if (!rows.length) return dashboard.message(el, '暂无可估算电耗的停车时段。');
  dashboard.table(el,['停车开始','时长 (h)','电量下降','估算电耗 (kWh)','平均功耗 (W)'],
    rows.map(r=>[new Date(r.start_ms).toLocaleString('zh-CN'),r.hours,r.soc_drop_pct+'%',r.kwh_lost,Math.round(r.avg_kw*1000)]));
  const long = rows.filter(r=>r.hours>=3);
  if (long.length) {
    const note = document.createElement('p');
    const watts = long.reduce((n,r)=>n+r.kwh_lost,0)*1000 / long.reduce((n,r)=>n+r.hours,0);
    note.textContent = '停车至少 3 小时的时段平均功耗约 ' + Math.round(watts) + ' W（按时长加权）';
    el.append(note);
  }
});
</script>
{% endblock %}

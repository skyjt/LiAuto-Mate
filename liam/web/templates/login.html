<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>看板登录 · LiAuto-Mate</title>
  <link rel="stylesheet" href="/static/css/liam.css">
</head>
<body>
<main class="password-panel">
  <p class="brand">LiAuto-Mate</p><h1>看板登录</h1>
  <form class="card" method="post" action="/login">
    <input type="hidden" name="next" value="{{ target }}">
    <label class="field" for="password">访问密码
      <input id="password" type="password" name="password" autocomplete="current-password" required autofocus
             {% if err %}aria-invalid="true" aria-describedby="login-error"{% endif %}>
    </label>
    {% if err %}<p class="error" id="login-error" role="alert">{{ err }}</p>{% endif %}
    <button class="primary stack">进入看板</button>
  </form>
</main>
</body>
</html>

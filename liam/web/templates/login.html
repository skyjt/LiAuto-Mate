<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · LiAuto-Mate</title>
  <link rel="stylesheet" href="/static/css/liam.css">
</head>
<body>
<main style="max-width:360px; margin-top:80px">
  <div class="card">
    <h3>LiAuto-Mate 登录</h3>
    {% if err %}<p style="color:var(--bad)">{{ err }}</p>{% endif %}
    <form method="post" action="/login">
      <input type="password" name="password" placeholder="访问密码"
             autofocus style="width:100%; margin-bottom:10px">
      <button style="width:100%">进入</button>
    </form>
  </div>
</main>
</body>
</html>

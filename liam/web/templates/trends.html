{% extends "base.html" %}
{% block title %}趋势 · LiAuto-Mate{% endblock %}
{% block assets %}<script src="/static/vendor/echarts.min.js"></script>{% endblock %}
{% block content %}
<section class="card">
  <h2>信号趋势</h2>
  {% if groups %}
  <form class="actions" id="filters">
    <label class="field">车辆信号<select id="sel-path">
      {% for g, paths in groups.items() %}<optgroup label="{{ g }}">
        {% for p in paths %}<option value="{{ p }}">{{ p.split('.')[-1] }}</option>{% endfor %}
      </optgroup>{% endfor %}
    </select></label>
    <label class="field">时间范围<select id="sel-hours">
      <option value="6">近 6 小时</option><option value="24" selected>近 24 小时</option>
      <option value="168">近 7 天</option><option value="720">近 30 天</option>
    </select></label>
    <button class="primary">查看</button>
  </form>
  {% else %}<p class="muted">暂无可选信号。首次采集后可选择信号和时间范围。</p>{% endif %}
</section>
{% if groups %}
<section class="card stack"><h2 id="signal-name" class="chart-title"></h2><p id="limit-note" class="muted" hidden></p><div id="chart" class="chart"></div></section>
<script>
function loadChart() {
  const path = document.getElementById('sel-path').value;
  const hours = document.getElementById('sel-hours').value;
  document.getElementById('signal-name').textContent = path;
  const note = document.getElementById('limit-note');
  note.hidden = true;
  dashboard.load(document.getElementById('chart'), '/api/v1/signal/'+encodeURIComponent(path)+'.json?hours='+hours, (data, el) => {
    if (!data.points.length) return dashboard.message(el, '该时段没有信号变化记录。');
    if (data.truncated) {
      note.textContent = '当前显示最近 ' + data.points.length + ' 条记录。';
      note.hidden = false;
    }
    const points = data.points.map(p => {
      const value = typeof p.v === 'boolean' || typeof p.v === 'number' ||
        (typeof p.v === 'string' && p.v.trim()) ? Number(p.v) : NaN;
      return [p.t, Number.isFinite(value) ? value : null];
    });
    if (!points.some(p=>p[1] !== null)) return dashboard.message(el, '此信号没有可绘制的数值。');
    dashboard.chart(el, {xAxis:{type:'time'}, yAxis:{type:'value',scale:true},
      series:[{type:'line',step:'end',data:points}]});
  });
}
document.getElementById('filters').addEventListener('submit', e => {e.preventDefault(); loadChart();});
loadChart();
</script>
{% endif %}
{% endblock %}

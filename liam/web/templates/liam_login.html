{% extends "base.html" %}
{% block title %}理想账号登录 · LiAuto-Mate{% endblock %}
{% block content %}
<section class="card" style="max-width:540px">
  <h2>短信验证</h2>
  <p class="muted">开始后会自动完成滑块验证；短信发出后输入收到的验证码即可。滑块未通过不会发送短信，可直接重试。</p>
  {% if login_error %}<p class="form-status" role="alert">{{ login_error }}</p>{% endif %}
  <form class="actions" id="phase-start">
    <label class="field">手机号<input id="phone" type="tel" autocomplete="tel-national" inputmode="numeric"
      pattern="[0-9]{11}" maxlength="11" required placeholder="11 位手机号" value="{{ phone }}"></label>
    <button class="primary" id="start" {% if login_error %}disabled{% endif %}>开始登录</button>
  </form>
  <p class="muted" id="cooldown" hidden></p>
  <form class="actions" id="phase-code" hidden>
    <label class="field"><span>发送至 <b id="phone-tail"></b> 的验证码</span>
      <input id="code" inputmode="numeric" autocomplete="one-time-code" required pattern="[0-9]{4,8}" maxlength="8"></label>
    <button class="primary" id="submit-code">提交验证码</button>
  </form>
  <p id="feedback" role="status" class="form-status"></p>
  <pre id="flow-status" class="muted form-status"></pre>
  <img id="shot" alt="本次账号登录的诊断截图" style="max-width:100%" hidden>
</section>
<script>
const $ = id => document.getElementById(id);
let phase = 'loading', busy = false, pollTimer;
const loginBlocked = {{ 'true' if login_error else 'false' }};
let cooldownEnd = Date.now() + {{ cooldown_left }} * 1000;
function showControls() {
  const remaining = Math.max(0, Math.ceil((cooldownEnd - Date.now())/1000));
  $('phase-start').hidden = !['idle','failed'].includes(phase);
  $('phase-code').hidden = !['waiting_code','submitting'].includes(phase);
  $('start').disabled = loginBlocked || busy || remaining > 0;
  $('submit-code').disabled = busy || phase === 'submitting';
  $('cooldown').hidden = $('phase-start').hidden || !remaining;
  if (remaining) $('cooldown').textContent = '可在 ' + remaining + ' 秒后再次发起登录。';
}
async function poll() {
  clearTimeout(pollTimer);
  try {
    const st = await dashboard.json('/liam-login/status.json');
    const wasWaiting = phase === 'waiting_code';
    phase = st.state;
    if (st.cooldown_left != null) cooldownEnd = Date.now() + st.cooldown_left * 1000;
    $('flow-status').textContent = (st.log || []).join('\n');
    $('shot').hidden = !st.screenshot;
    if (st.screenshot) $('shot').src = 'data:image/png;base64,' + st.screenshot;
    $('phone-tail').textContent = '尾号 ' + (st.phone_tail || '****');
    $('feedback').textContent = st.error || ({running:'正在准备账号登录，请稍候。',submitting:'正在验证…',
      waiting_code:'请输入收到的短信验证码。',recovering:'凭据已保存，正在恢复会话…'}[phase] || '');
    showControls();
    if (phase === 'waiting_code' && !wasWaiting) $('code').focus();
    if (phase === 'done') {
      const result = await dashboard.json('/liam-login/finish.json');
      if (result.ok) {
        const target = result.next || '/';
        $('feedback').textContent = target === '/' ? '登录完成，即将返回概览。' : '登录完成，请前往设置绑定车辆。';
        setTimeout(() => location.assign(target), 1000);
        return;
      }
    }
    if (!['idle','failed'].includes(phase)) pollTimer = setTimeout(poll, 3000);
  } catch (error) {
    $('feedback').textContent = error.message + ' 可刷新页面查看进度。';
  }
}
async function submit(event, url, body) {
  event.preventDefault();
  if (busy) return;
  busy = true;
  clearTimeout(pollTimer);
  showControls();
  try {
    const response = await fetch(url, {method:'POST', body:new URLSearchParams(body)});
    const data = await response.json();
    if (data.cooldown_left != null) cooldownEnd = Date.now() + data.cooldown_left * 1000;
    if (!response.ok || !data.ok) throw new Error(data.error || data.detail || '请求未成功');
    await poll();
  } catch (error) {
    $('feedback').textContent = error.message;
  } finally {
    busy = false;
    showControls();
  }
}
$('phase-start').addEventListener('submit', e => submit(e,'/liam-login/start',{phone:$('phone').value}));
$('phase-code').addEventListener('submit', e => submit(e,'/liam-login/code',{code:$('code').value}));
setInterval(showControls, 1000);
showControls();
poll();
</script>
{% endblock %}

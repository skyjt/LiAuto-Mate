services:
  liauto-mate:
    build: .
    container_name: liauto-mate
    ports: ["8080:8080"]
    volumes: ["liauto-mate-data:/data"]           # SQLite + 加密凭据，全部状态在此
    environment:
      LIAM_UI_PASSWORD: "${LIAM_UI_PASSWORD:?必填：Web 访问密码}"
      LIAM_PHONE: "${LIAM_PHONE:-}"              # 可选；重登面板预填
      LIAM_LOGIN_HEADLESS: "${LIAM_LOGIN_HEADLESS:-1}"  # 0=有界面（排查滑块）
      LIAM_MCP_TOKEN: "${LIAM_MCP_TOKEN:-}"      # 可选；设置才启用 /mcp
      LIAM_AMAP_KEY: "${LIAM_AMAP_KEY:-}"
      TZ: "${TZ:-Asia/Shanghai}"
    restart: unless-stopped
volumes:
  liauto-mate-data: {}
